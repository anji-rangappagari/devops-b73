- name: Import RabbitMQ repository signing keys
  ansible.builtin.rpm_key:
    state: present
    key: "{{ item }}"
  loop:
    - https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
    - https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
    - https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key

- name: Configure official RabbitMQ yum repositories
  ansible.builtin.copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo
    owner: root
    group: root
    mode: '0644'

- name: Install RabbitMQ and Erlang
  ansible.builtin.dnf:
    name:
      - logrotate
      - erlang
      - rabbitmq-server
    state: present

- name: Start and enable RabbitMQ server
  ansible.builtin.systemd:
    name: rabbitmq-server
    state: started
    enabled: true

- name: Add Application user
  ansible.builtin.command: rabbitmqctl add_user roboshop {{ rabbitmq_app_password }}
  register: rabbitmq_add_user
  changed_when: rabbitmq_add_user.rc == 0
  failed_when:
    - rabbitmq_add_user.rc != 0
    - "'already_exists' not in rabbitmq_add_user.stderr"
    - "'already exists' not in (rabbitmq_add_user.stderr ~ rabbitmq_add_user.stdout)"

- name: Set Application user tags
  ansible.builtin.command: rabbitmqctl set_user_tags roboshop administrator

- name: Set Application user permissions
  ansible.builtin.command: >-
    rabbitmqctl set_permissions -p / roboshop ".*" ".*" ".*"
