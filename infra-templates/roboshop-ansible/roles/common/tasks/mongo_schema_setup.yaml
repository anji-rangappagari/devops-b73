- name: Copy MongoDB Repo file
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install Mongo Client
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

- name: Check for component schema prep tasks
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/roles/{{ component | default(role_name) }}/tasks/schema_prep.yaml"
  delegate_to: localhost
  become: false
  register: schema_prep_tasks

- name: Prepare MongoDB schema
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/{{ component | default(role_name) }}/tasks/schema_prep.yaml"
  when: schema_prep_tasks.stat.exists

- name: Verify schema file exists
  ansible.builtin.stat:
    path: "{{ schema_file | default('/app/db/master-data.js') }}"
  register: schema_file_stat

- name: Fail when schema file is missing
  ansible.builtin.fail:
    msg: >
      Schema file {{ schema_file | default('/app/db/master-data.js') }} not found.
      Add db/master-data.js to the app artifact or create
      roles/{{ component | default(role_name) }}/tasks/schema_prep.yaml on the Ansible controller.
  when: not schema_file_stat.stat.exists

- name: Load schema
  ansible.builtin.shell: >
    mongosh --host {{ mongodb_host | default('mongodb-dev.oneseven.space') }}
    < {{ schema_file | default('/app/db/master-data.js') }}
