- name: Copy MongoDB Repo file
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install Mongo Client
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

- name: Check bundled schema on controller
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/roles/{{ component }}/files/master-data.js"
  delegate_to: localhost
  become: false
  register: bundled_schema

- name: Check schema file in extracted app
  ansible.builtin.stat:
    path: "{{ schema_file | default('/app/db/master-data.js') }}"
  register: app_schema

- name: Ensure db directory exists
  ansible.builtin.file:
    path: "{{ (schema_file | default('/app/db/master-data.js')) | dirname }}"
    state: directory
  when:
    - not app_schema.stat.exists
    - bundled_schema.stat.exists

- name: Copy MongoDB schema from role when missing in artifact
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/{{ component }}/files/master-data.js"
    dest: "{{ schema_file | default('/app/db/master-data.js') }}"
  when:
    - not app_schema.stat.exists
    - bundled_schema.stat.exists

- name: Load schema
  ansible.builtin.shell: >
    mongosh --host {{ mongodb_host | default('mongodb-dev.oneseven.space') }}
    < {{ schema_file | default('/app/db/master-data.js') }}
