- name: Copy MongoDB Repo file
  ansible.builtin.copy:
    src: mongodb.repo
    dest: /etc/yum.repos.d/mongodb.repo

- name: Install Mongo Client
  ansible.builtin.dnf:
    name:  mongodb-org-shell
    state: installed
- name: Load schema
  ansible.builtin.shell: mongo -host mongodb-dev.oneseven.space <app/schema/db/{{ component }}.js