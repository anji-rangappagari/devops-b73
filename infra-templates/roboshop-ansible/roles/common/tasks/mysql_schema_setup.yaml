- name: Load {{ component }} database schema
  ansible.builtin.shell: >
    mysql -h {{ mysql_host }} -uroot -p'{{ mysql_root_password }}'
    < /app/db/schema.sql

- name: Create {{ component }} database user
  ansible.builtin.shell: >
    mysql -h {{ mysql_host }} -uroot -p'{{ mysql_root_password }}'
    < /app/db/app-user.sql

- name: Load {{ component }} master data
  ansible.builtin.shell: >
    mysql -h {{ mysql_host }} -uroot -p'{{ mysql_root_password }}'
    < /app/db/master-data.sql

- name: Verify cities master data is present
  ansible.builtin.shell: >
    mysql -h {{ mysql_host }} -uroot -p'{{ mysql_root_password }}'
    -N -e "SELECT COUNT(*) FROM cities.cities;"
  register: cities_count
  changed_when: false
  failed_when: cities_count.stdout | trim | int < 1
