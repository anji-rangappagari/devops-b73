- name: Install Maven and MySQL client
  ansible.builtin.dnf:
    name:
      - maven
      - mysql
      - unzip
    state: present

- name: App pre-requisites
  ansible.builtin.import_tasks:
    file: app_presetup.yaml

- name: Build Maven application
  ansible.builtin.shell: |
    set -e
    mvn clean package
    mv target/{{ component }}-1.0.jar {{ component }}.jar
  args:
    chdir: /app

- name: Set application directory ownership
  ansible.builtin.file:
    path: /app
    owner: roboshop
    group: roboshop
    recurse: true

- name: Systemd Setup
  ansible.builtin.import_tasks:
    file: systemd_setup.yaml

- name: MySQL Schema Setup
  ansible.builtin.import_tasks:
    file: mysql_schema_setup.yaml

- name: Restart {{ component }} service after schema load
  ansible.builtin.systemd:
    name: "{{ component }}"
    state: restarted
    enabled: true
