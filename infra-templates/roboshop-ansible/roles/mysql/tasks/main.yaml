- name: Disable Mysql default module
  ansible.builtin.command: dnf module disable mysql -y
- name: copy mysql repo file
  ansible.builtin.copy:
    src: mysql.repo
    dest: /etc/yum.repos.d/mysql.repo
    owner: root
    group: root
    mode: '0644'

- name: Install mysql comminity server
  ansible.builtin.dnf:
    name: mysql-community-server
    state: present
  register: mysql_install
- name: Start Mysql service
  ansible.builtin.systemd:
    name: mysqld
    state: restarted
    enabled: yes

- name: Configure MySQL to listen on all interfaces
  ansible.builtin.copy:
    dest: /etc/my.cnf.d/roboshop.cnf
    owner: root
    group: root
    mode: '0644'
    content: |
      [mysqld]
      bind-address=0.0.0.0
      mysqlx-bind-address=0.0.0.0

- name: Restart MySQL after network configuration
  ansible.builtin.systemd:
    name: mysqld
    state: restarted

- name: Set MySQL root password on fresh installation
  ansible.builtin.command: mysql_secure_installation --set-root-pass {{ mysql_root_password }}
  when: mysql_install.changed

- name: Allow remote root connections for RoboShop
  ansible.builtin.command: >-
    mysql -uroot -p'{{ mysql_root_password }}' -e
    "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    ALTER USER 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;"
