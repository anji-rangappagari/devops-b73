- name: Install MySQL Server 8.x
  ansible.builtin.dnf:
    name: mysql-server
    state: present
  register: mysql_install

- name: Start and enable MySQL service
  ansible.builtin.systemd:
    name: mysqld
    state: started
    enabled: true

- name: Configure MySQL to listen on all interfaces
  ansible.builtin.copy:
    dest: /etc/my.cnf.d/roboshop.cnf
    owner: root
    group: root
    mode: '0644'
    content: |
      [mysqld]
      bind-address=0.0.0.0
      mysqlx-bind-address=0.0.0.0

- name: Restart MySQL after network configuration
  ansible.builtin.systemd:
    name: mysqld
    state: restarted
  when: mysql_install.changed

- name: Set MySQL root password on fresh installation
  ansible.builtin.command:
    argv:
      - mysql_secure_installation
      - --set-root-pass
      - "{{ mysql_root_password }}"
  when: mysql_install.changed
  no_log: true

# --- Existing install: discover how we can login, then set RoboShop password ---

- name: Check login with desired root password
  ansible.builtin.command:
    argv: [mysql, -uroot, -e, "SELECT 1;"]
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"
  register: mysql_login_desired
  changed_when: false
  failed_when: false
  when: not mysql_install.changed
  no_log: true

- name: Check passwordless / socket root login
  ansible.builtin.command:
    argv: [mysql, -uroot, -e, "SELECT 1;"]
  register: mysql_login_socket
  changed_when: false
  failed_when: false
  when:
    - not mysql_install.changed
    - mysql_login_desired.rc != 0

- name: Check login with provided current root password
  ansible.builtin.command:
    argv: [mysql, -uroot, -e, "SELECT 1;"]
  environment:
    MYSQL_PWD: "{{ mysql_current_root_password | default('') }}"
  register: mysql_login_current
  changed_when: false
  failed_when: false
  when:
    - not mysql_install.changed
    - mysql_login_desired.rc != 0
    - mysql_login_socket.rc is defined
    - mysql_login_socket.rc != 0
    - mysql_current_root_password is defined
    - mysql_current_root_password | length > 0
    - mysql_current_root_password not in ['OLD_PASSWORD', 'CURRENT_PASSWORD', 'ACTUAL_CURRENT_PASSWORD']
  no_log: true

- name: Fail if no working MySQL root login method
  ansible.builtin.fail:
    msg: >-
      Cannot log in to MySQL as root.
      Desired password (mysql_root_password) does not work,
      passwordless/socket login does not work,
      and mysql_current_root_password did not work (or was not provided).
      Reset on the host, then re-run:

        sudo systemctl stop mysqld
        sudo mysqld --skip-grant-tables --user=mysql &
        sleep 3
        mysql -uroot -e "FLUSH PRIVILEGES; ALTER USER 'root'@'localhost' IDENTIFIED BY 'RoboShop@1';"
        sudo pkill mysqld
        sudo systemctl start mysqld
  when:
    - not mysql_install.changed
    - mysql_login_desired.rc != 0
    - mysql_login_socket.rc | default(1) != 0
    - mysql_login_current.rc | default(1) != 0

- name: Set root password using socket login
  ansible.builtin.command:
    argv:
      - mysql
      - -uroot
      - -e
      - "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}'; FLUSH PRIVILEGES;"
  when:
    - not mysql_install.changed
    - mysql_login_desired.rc != 0
    - mysql_login_socket.rc | default(1) == 0
  no_log: true

- name: Set root password using provided current password
  ansible.builtin.command:
    argv:
      - mysql
      - -uroot
      - -e
      - "ALTER USER 'root'@'localhost' IDENTIFIED BY '{{ mysql_root_password }}'; FLUSH PRIVILEGES;"
  environment:
    MYSQL_PWD: "{{ mysql_current_root_password }}"
  when:
    - not mysql_install.changed
    - mysql_login_desired.rc != 0
    - mysql_login_socket.rc | default(1) != 0
    - mysql_login_current.rc | default(1) == 0
  no_log: true

- name: Allow remote root connections for RoboShop
  ansible.builtin.command:
    argv:
      - mysql
      - -uroot
      - -e
      - >-
        CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
        ALTER USER 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
        GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
        FLUSH PRIVILEGES;
  environment:
    MYSQL_PWD: "{{ mysql_root_password }}"
  no_log: true
