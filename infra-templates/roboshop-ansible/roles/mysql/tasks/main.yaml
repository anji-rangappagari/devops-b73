- name: Install MySQL Server
  ansible.builtin.dnf:
    name: mysql-server
    state: present
  register: mysql_install

- name: Start and enable MySQL service
  ansible.builtin.systemd:
    name: mysqld
    state: started
    enabled: true

- name: Configure MySQL to listen on all interfaces
  ansible.builtin.copy:
    dest: /etc/my.cnf.d/roboshop.cnf
    owner: root
    group: root
    mode: '0644'
    content: |
      [mysqld]
      bind-address=0.0.0.0
      mysqlx-bind-address=0.0.0.0

- name: Restart MySQL after network configuration
  ansible.builtin.systemd:
    name: mysqld
    state: restarted

- name: Set MySQL root password on fresh installation
  ansible.builtin.command: mysql_secure_installation --set-root-pass {{ mysql_root_password }}
  when: mysql_install.changed
  no_log: true

- name: Require current MySQL root password on existing installation
  ansible.builtin.assert:
    that:
      - mysql_current_root_password is defined
      - mysql_current_root_password | length > 0
    fail_msg: >-
      MySQL is already installed. Pass the existing root password with
      -e mysql_current_root_password='CURRENT_PASSWORD'.
  when: not mysql_install.changed

- name: Allow remote root connections for RoboShop
  ansible.builtin.command: >-
    mysql -uroot -e
    "CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    ALTER USER 'root'@'%' IDENTIFIED BY '{{ mysql_root_password }}';
    GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION;
    FLUSH PRIVILEGES;"
  environment:
    MYSQL_PWD: "{{ mysql_current_root_password | default(mysql_root_password) }}"
  no_log: true
