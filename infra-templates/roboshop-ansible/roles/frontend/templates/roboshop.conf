location /images/ {
  expires 5s;
  root   /usr/share/nginx/html;
  try_files $uri /images/placeholder.jpg;
}

location /api/catalogue/ { 
  proxy_http_version 1.1; 
  proxy_pass {{ lookup('amazon.aws.aws_ssm', '/roboshop/{{env}}}/frontend/catalogue_url', region='us-east-1' ) }}; 
}
location /api/user/ { 
  proxy_http_version 1.1; 
  proxy_pass {{ lookup('amazon.aws.aws_ssm', '/roboshop/{{env}}}/user/user_url', region='us-east-1' ) }}; 
}
location /api/cart/ { 
  proxy_http_version 1.1; 
  proxy_pass {{ lookup('amazon.aws.aws_ssm', '/roboshop/{{env}}}/cart/cart_url', region='us-east-1' ) }}; 
}
location /api/shipping/ { 
  proxy_http_version 1.1; 
  proxy_pass {{ lookup('amazon.aws.aws_ssm', '/roboshop/{{env}}}/shipping/shipping_url', region='us-east-1' ) }}; 
}
location /api/payment/ { 
  proxy_http_version 1.1; 
  proxy_pass {{ lookup('amazon.aws.aws_ssm', '/roboshop/{{env}}}/payment/payment_url', region='us-east-1' ) }}; 
}

location /health {
  stub_status on;
  access_log off;
}