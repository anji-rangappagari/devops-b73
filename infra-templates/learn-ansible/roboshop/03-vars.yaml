# write output and filter last value in the output
- name: Register variabl
  hosts: localhost
  connection: local
  tasks:
    - name: Shell command
      ansible.builtin.shell: uptime
      register: output
    - name: Print O/P
      ansible.builtin.debug:
        msg: "{{ output.stdout | split(' ') | last }}"
